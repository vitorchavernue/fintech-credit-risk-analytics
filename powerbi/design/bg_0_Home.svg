<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
    <stop stop-color="#081A3A"/><stop offset="0.55" stop-color="#0D2A5C"/><stop offset="1" stop-color="#123A7A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#3FB6E8"/><stop offset="1" stop-color="#1E5FD0"/>
  </linearGradient>
  <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#1E5FD0"/><stop offset="1" stop-color="#3FB6E8"/>
  </linearGradient>
  <linearGradient id="activeChip" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#2F7BEA"/><stop offset="1" stop-color="#3FB6E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1700 120) scale(900)">
    <stop stop-color="#3FB6E8" stop-opacity="0.35"/><stop offset="1" stop-color="#3FB6E8" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%" color-interpolation-filters="sRGB">
