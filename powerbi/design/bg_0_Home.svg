    <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0D2A5C" flood-opacity="0.06"/>
  </filter>
  <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000814" flood-opacity="0.35"/>
  </filter>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.08"/>
  </pattern>
</defs>
